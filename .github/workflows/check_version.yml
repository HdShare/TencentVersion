name: Check Version

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    if: github.repository == 'HdShare/TencentVersion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Run Script
        run: node .github/scripts/check_version.js

      - name: Commit Changes
        if: success()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/dyData.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "新增: 抖音下载地址"
            git push origin HEAD:master
          fi
